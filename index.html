<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
    <title>Vision+</title>
    <style>
        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            position: relative;
        }
        .header-user img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #b0e0e6;
        }
        .header-user .username {
            color: #d4e9ed;
            font-weight: 600;
            font-size: 0.9em;
        }
        @media (max-width: 767px) {
            .header-user .username { display: none; }
        }
        .user-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            min-width: 160px;
            display: none;
            overflow: hidden;
            z-index: 1000;
        }
        .user-dropdown.show { display: block; }
        .user-dropdown a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            color: #1e2b2f;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9em;
            border-bottom: 1px solid #f0f0f0;
            transition: 0.2s;
        }
        .user-dropdown a:hover { background: #f4f9fa; }
        .user-dropdown a:last-child {
            border-bottom: none;
            color: #ff6b6b;
        }
        .user-dropdown a i { width: 20px; text-align: center; }
        
        /* تنسيقات الموهوبين */
        .freelancers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .freelancer-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            border: 1px solid #e8eeef;
        }
        .freelancer-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            border-color: #b0e0e6;
        }
        .freelancer-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #b0e0e6;
            margin-bottom: 10px;
        }
        .freelancer-card .name {
            font-weight: 700;
            color: #1e2b2f;
            font-size: 1.1em;
        }
        .freelancer-card .category {
            font-weight: 400;
            color: #5a6f73;
            font-size: 0.85em;
        }
        .freelancer-card .stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            font-size: 0.8em;
            color: #5a6f73;
        }
        .freelancer-card .stats span i {
            margin-right: 4px;
        }
        .freelancer-card .rank {
            display: inline-block;
            background: #b0e0e6;
            color: #1e2b2f;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            line-height: 26px;
            font-weight: 800;
            font-size: 0.75em;
            margin-bottom: 8px;
        }
        .category-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }
        .category-filter button {
            padding: 8px 20px;
            border-radius: 30px;
            border: 2px solid #b0e0e6;
            background: transparent;
            color: #1e2b2f;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9em;
        }
        .category-filter button:hover,
        .category-filter button.active {
            background: #b0e0e6;
            color: #1e2b2f;
            transform: scale(1.05);
        }
        .viral .subtitle {
            text-align: center;
            color: #b0e0e6;
            font-weight: 400;
            margin-top: -10px;
            margin-bottom: 25px;
            opacity: 0.8;
        }
        .viral .content {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #5a6f73;
            width: 100%;
        }
        .empty-state i {
            font-size: 3em;
            color: #b0e0e6;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">VISION+</a>
        <nav class="nav">
            <a href="index.html">الرئيسية</a>
            <a href="yourpage.html">حسابي</a>
            <a href="admin.html" style="color:#ff6b6b;">الإدارة</a>
            <div class="header-user" id="header-user" style="display:none;" onclick="toggleDropdown(event)">
                <img id="header-avatar" src="img/default-avatar.jpg" alt="avatar" />
                <span class="username" id="header-username">مستخدم</span>
                <div class="user-dropdown" id="user-dropdown">
                    <a href="yourpage.html"><i class="fas fa-user-edit"></i> حسابي</a>
                    <a href="#" onclick="event.stopPropagation(); logoutUser();"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
                </div>
            </div>
        </nav>
    </header>

    <section class="main" id="home">
        <div class="main-content">
            <h1 id="hero-title">مرحباً بك في VISION+</h1>
            <h2 id="hero-subtitle">منصة تجمع بين الموهوبين والعملاء</h2>
            <a href="yourpage.html" class="main-btn">انضم الآن</a>
        </div>
        <div class="floating-icons">
            <i class="fa-sharp fa-solid fa-pen-to-square fly-icon" style="--delay:0s; top:8%; left:3%; font-size: 3.5rem;"></i>
            <i class="fa-solid fa-code fly-icon" style="--delay:0.8s; top:15%; right:5%; font-size: 4rem;"></i>
            <i class="fa-solid fa-language fly-icon" style="--delay:1.6s; bottom:20%; left:5%; font-size: 3.8rem;"></i>
            <i class="fa-solid fa-paintbrush fly-icon" style="--delay:2.4s; top:40%; right:3%; font-size: 4.2rem;"></i>
            <i class="fa-solid fa-camera fly-icon" style="--delay:3.2s; bottom:12%; right:8%; font-size: 3.6rem;"></i>
        </div>
    </section>

    <section class="cards" id="services">
        <h2 class="title">التخصصات</h2>
        <div class="category-filter" id="category-filter"></div>
    </section>

    <section class="viral" id="viral">
        <h2 class="title" id="viral-title">🏆 الموهوبون</h2>
        <p class="subtitle" id="viral-note">اختر تخصصاً من الأعلى لعرض الموهوبين</p>
        <div class="content" id="viral-content">
            <div id="freelancers-container">
                <div class="empty-state">
                    <i class="fas fa-users"></i>
                    <p>اختر تخصصاً من الأعلى لعرض الموهوبين</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col">
                <h3>عن المنصة</h3>
                <p id="footer-text">جميع الحقوق محفوظة © 2026 Vision+</p>
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="auth.js"></script>
    <script>
        // ===== دوال عامة =====
        function toggleDropdown(event) {
            event.stopPropagation();
            document.getElementById('user-dropdown').classList.toggle('show');
        }
        document.addEventListener('click', function() {
            document.getElementById('user-dropdown').classList.remove('show');
        });

        function updateHeaderUI() {
            const user = getCurrentUser();
            const headerUser = document.getElementById('header-user');
            if (user) {
                headerUser.style.display = 'flex';
                document.getElementById('header-avatar').src = user.photoURL || 'img/default-avatar.jpg';
                document.getElementById('header-username').textContent = user.displayName || 'مستخدم';
            } else {
                headerUser.style.display = 'none';
            }
        }

        function viewProfile(uid) {
            window.location.href = `profile.html?uid=${uid}`;
        }

        // ===== تحميل التخصصات والأزرار =====
        async function loadCategories() {
            try {
                const categories = await loadFromFirebase('categories');
                const filterContainer = document.getElementById('category-filter');
                
                if (!categories || Object.keys(categories).length === 0) {
                    filterContainer.innerHTML = '<p style="color:#5a6f73;">لا توجد تخصصات بعد</p>';
                    return;
                }
                
                let html = `<button class="active" onclick="showAllFreelancers()">🌟 الكل</button>`;
                Object.values(categories).forEach(cat => {
                    html += `
                        <button onclick="showCategory('${cat.id}')" style="color:${cat.color || '#b0e0e6'}; border-color:${cat.color || '#b0e0e6'};">
                            <i class="fas ${cat.icon}"></i> ${cat.name}
                        </button>
                    `;
                });
                filterContainer.innerHTML = html;
                
                // عرض الكل افتراضياً
                showAllFreelancers();
                
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // ===== عرض جميع الموهوبين =====
        async function showAllFreelancers() {
            try {
                const users = await loadFromFirebase('users');
                const container = document.getElementById('freelancers-container');
                
                if (!users) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <p>لا يوجد موهوبين بعد</p>
                        </div>
                    `;
                    return;
                }
                
                let freelancers = Object.values(users).filter(u => u.status === 'approved');
                
                if (freelancers.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <p>لا يوجد موهوبين مفعلين بعد</p>
                        </div>
                    `;
                    return;
                }
                
                // ترتيب حسب المشاهدات
                freelancers.sort((a, b) => (b.views || 0) - (a.views || 0));
                
                // أخذ أفضل 12
                freelancers = freelancers.slice(0, 12);
                
                let html = `<div class="freelancers-grid">`;
                freelancers.forEach((f, index) => {
                    html += `
                        <div class="freelancer-card" onclick="viewProfile('${f.uid}')">
                            <div class="rank">#${index + 1}</div>
                            <img src="${f.profilePic || 'img/default-avatar.jpg'}" alt="${f.username}" />
                            <div class="name">${f.username || 'غير معروف'}</div>
                            <div class="category">${f.categoryId || 'لا يوجد تخصص'}</div>
                            <div class="stats">
                                <span><i class="fas fa-eye"></i> ${f.views || 0}</span>
                                <span><i class="fas fa-heart" style="color:#ff6b6b;"></i> ${f.likes || 0}</span>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
                
                document.getElementById('viral-title').textContent = '🏆 الموهوبون';
                document.getElementById('viral-note').textContent = 'أفضل المواهب على المنصة';
                
            } catch (error) {
                console.error('Error loading freelancers:', error);
            }
        }

        // ===== عرض الموهوبين حسب التخصص =====
        async function showCategory(categoryId) {
            try {
                // تحديث الأزرار
                document.querySelectorAll('#category-filter button').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.classList.add('active');
                
                const users = await loadFromFirebase('users');
                const container = document.getElementById('freelancers-container');
                const categories = await loadFromFirebase('categories');
                
                // اسم التخصص
                const cat = categories ? Object.values(categories).find(c => c.id === categoryId) : null;
                const catName = cat ? cat.name : categoryId;
                
                if (!users) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <p>لا يوجد موهوبين في ${catName}</p>
                        </div>
                    `;
                    return;
                }
                
                let freelancers = Object.values(users).filter(u => 
                    u.status === 'approved' && u.categoryId === categoryId
                );
                
                if (freelancers.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <p>لا يوجد موهوبين في ${catName} حالياً</p>
                            <p style="font-weight:400; margin-top:10px;">كن الأول! <a href="yourpage.html" style="color:#b0e0e6;">سجل الآن</a></p>
                        </div>
                    `;
                    return;
                }
                
                // ترتيب حسب المشاهدات (تنازلي)
                freelancers.sort((a, b) => (b.views || 0) - (a.views || 0));
                
                let html = `<div class="freelancers-grid">`;
                freelancers.forEach((f, index) => {
                    html += `
                        <div class="freelancer-card" onclick="viewProfile('${f.uid}')">
                            <div class="rank">#${index + 1}</div>
                            <img src="${f.profilePic || 'img/default-avatar.jpg'}" alt="${f.username}" />
                            <div class="name">${f.username || 'غير معروف'}</div>
                            <div class="category">${f.categoryId || 'لا يوجد تخصص'}</div>
                            <div class="stats">
                                <span><i class="fas fa-eye"></i> ${f.views || 0}</span>
                                <span><i class="fas fa-heart" style="color:#ff6b6b;"></i> ${f.likes || 0}</span>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
                
                document.getElementById('viral-title').textContent = `📂 ${catName}`;
                document.getElementById('viral-note').textContent = `الموهوبون في مجال ${catName}`;
                
                // تمرير للقسم
                document.getElementById('viral').scrollIntoView({ behavior: 'smooth' });
                
            } catch (error) {
                console.error('Error showing category:', error);
            }
        }

        // ===== تحميل النصوص =====
        async function loadTexts() {
            try {
                const texts = await loadFromFirebase('site_texts');
                if (texts) {
                    if (texts.hero_title) document.getElementById('hero-title').textContent = texts.hero_title;
                    if (texts.hero_subtitle) document.getElementById('hero-subtitle').textContent = texts.hero_subtitle;
                    if (texts.footer_text) document.getElementById('footer-text').textContent = texts.footer_text;
                    if (texts.viral_title) document.getElementById('viral-title').textContent = texts.viral_title;
                    if (texts.viral_note) {
                        document.getElementById('viral-note').textContent = texts.viral_note;
                    }
                }
            } catch (error) {
                console.error('Error loading texts:', error);
            }
        }

        // ===== تهيئة الصفحة =====
        document.addEventListener('DOMContentLoaded', function() {
            updateHeaderUI();
            loadCategories();
            loadTexts();
            
            // مراقبة تغيير المستخدم
            const user = getCurrentUser();
            if (user) {
                updateHeaderUI();
            }
        });
    </script>
</body>
</html>
