<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
    <title>Vision+</title>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">VISION+</a>
        <nav class="nav">
            <a href="index.html">الرئيسية</a>
            <a href="yourpage.html">حسابي</a>
            <a href="admin.html" style="color:#ff6b6b;">الإدارة</a>
            <div class="header-user" id="header-user" style="display:none;" onclick="toggleDropdown(event)">
                <img id="header-avatar" src="img/default-avatar.jpg" alt="avatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #b0e0e6;" />
                <span class="username" id="header-username" style="color:#d4e9ed;font-weight:600;font-size:0.9em;display:none;">مستخدم</span>
                <div class="user-dropdown" id="user-dropdown" style="position:absolute;top:45px;right:0;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.2);min-width:160px;display:none;overflow:hidden;z-index:1000;">
                    <a href="yourpage.html" style="display:flex;align-items:center;gap:10px;padding:10px 18px;color:#1e2b2f;text-decoration:none;font-weight:500;font-size:0.9em;border-bottom:1px solid #f0f0f0;">
                        <i class="fas fa-user-edit"></i> حسابي
                    </a>
                    <a href="#" onclick="event.stopPropagation(); logoutUser();" style="display:flex;align-items:center;gap:10px;padding:10px 18px;color:#ff6b6b;text-decoration:none;font-weight:500;font-size:0.9em;">
                        <i class="fas fa-sign-out-alt"></i> تسجيل خروج
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <section class="main" id="home">
        <div class="main-content">
            <h1 id="hero-title">مرحباً بك في VISION+</h1>
            <h2 id="hero-subtitle">منصة تجمع بين الموهوبين والعملاء</h2>
            <a href="yourpage.html" class="main-btn">انضم الآن</a>
        </div>
        <div class="floating-icons">
            <i class="fa-sharp fa-solid fa-pen-to-square fly-icon" style="--delay:0s; top:8%; left:3%; font-size: 3.5rem;"></i>
            <i class="fa-solid fa-code fly-icon" style="--delay:0.8s; top:15%; right:5%; font-size: 4rem;"></i>
            <i class="fa-solid fa-language fly-icon" style="--delay:1.6s; bottom:20%; left:5%; font-size: 3.8rem;"></i>
            <i class="fa-solid fa-paintbrush fly-icon" style="--delay:2.4s; top:40%; right:3%; font-size: 4.2rem;"></i>
            <i class="fa-solid fa-camera fly-icon" style="--delay:3.2s; bottom:12%; right:8%; font-size: 3.6rem;"></i>
        </div>
    </section>

    <section class="cards" id="services">
        <h2 class="title">الخدمات</h2>
        <div class="content" id="services-content"></div>
    </section>

    <section class="viral" id="viral">
        <h2 class="title" id="viral-title">🎯 الموهوبون</h2>
        <p id="viral-note" style="display:none; text-align:center; color:var(--color-primary); font-weight:400; margin:-15px 0 30px;"></p>
        <div class="content" id="viral-content"></div>
    </section>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col">
                <h3>عن المنصة</h3>
                <p id="footer-text">جميع الحقوق محفوظة © 2026 Vision+</p>
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="auth.js"></script>
    <script>
        // ===== إظهار/إخفاء القائمة =====
        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('user-dropdown');
            dropdown.classList.toggle('show');
        }
        document.addEventListener('click', function() {
            document.getElementById('user-dropdown').classList.remove('show');
        });

        // ===== تحديث رأس الصفحة =====
        function updateHeader() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('header-user').style.display = 'flex';
                document.getElementById('header-avatar').src = user.photoURL;
                document.getElementById('header-username').textContent = user.displayName;
                document.getElementById('header-username').style.display = 'inline';
            }
        }

        // ===== تحميل التخصصات =====
        async function loadServices() {
            const container = document.getElementById('services-content');
            try {
                const categories = await loadFromFirebase('categories');
                if (!categories) {
                    container.innerHTML = '<p style="color:#5a6f73; text-align:center; width:100%;">لا توجد خدمات حالياً</p>';
                    return;
                }
                
                let html = '';
                Object.values(categories).forEach(cat => {
                    html += `
                        <div class="card" onclick="showCategory('${cat.id}')" style="cursor:pointer;">
                            <div class="icon" style="color:${cat.color || '#b0e0e6'};">
                                <i class="fas ${cat.icon}"></i>
                            </div>
                            <div class="info">
                                <h2>${cat.name}</h2>
                                <p>عرض الموهوبين</p>
                                <a href="#" onclick="event.stopPropagation(); showCategory('${cat.id}')">عرض</a>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading services:', error);
            }
        }

        // ===== عرض الموهوبين حسب التخصص (مرتبين حسب المشاهدات) =====
        async function showCategory(categoryId) {
            try {
                const users = await loadFromFirebase('users');
                const container = document.getElementById('viral-content');
                
                if (!users) {
                    container.innerHTML = '<p style="color:#5a6f73; text-align:center; width:100%;">لا يوجد موهوبين بعد</p>';
                    return;
                }
                
                let freelancers = Object.values(users).filter(u => 
                    u.status === 'approved' && u.categoryId === categoryId
                );
                
                // ترتيب تنازلي حسب المشاهدات
                freelancers.sort((a, b) => (b.views || 0) - (a.views || 0));
                
                if (freelancers.length === 0) {
                    container.innerHTML = `
                        <div style="width:100%; text-align:center; padding:40px; color:#5a6f73;">
                            <p>لا يوجد موهوبين في هذا المجال</p>
                            <p style="font-weight:400;">كن الأول! <a href="yourpage.html" style="color:#b0e0e6;">سجل الآن</a></p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                freelancers.forEach(f => {
                    html += `
                        <div class="viral-card" onclick="viewProfile('${f.uid}')">
                            <div class="viral-img">
                                <img src="${f.profilePic || 'img/default-avatar.jpg'}" alt="${f.username}" />
                            </div>
                            <div class="viral-info">
                                <p class="category">⭐ ${f.username}</p>
                                <strong class="v-title">
                                    <span>${f.categoryId}</span>
                                    <span style="font-weight:400; font-size:0.8em; color:#5a6f73;">
                                        <i class="fas fa-eye"></i> ${f.views || 0}
                                    </span>
                                    <a href="#" class="viralbtn" onclick="event.stopPropagation(); viewProfile('${f.uid}')">عرض</a>
                                </strong>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                document.getElementById('viral').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error('Error showing category:', error);
            }
        }

        // ===== عرض الملف الشخصي =====
        function viewProfile(uid) {
            window.location.href = `profile.html?uid=${uid}`;
        }

        // ===== تحميل النصوص =====
        async function loadTexts() {
            try {
                const texts = await loadFromFirebase('site_texts');
                if (texts) {
                    if (texts.hero_title) document.getElementById('hero-title').textContent = texts.hero_title;
                    if (texts.hero_subtitle) document.getElementById('hero-subtitle').textContent = texts.hero_subtitle;
                    if (texts.footer_text) document.getElementById('footer-text').textContent = texts.footer_text;
                    if (texts.viral_title) document.getElementById('viral-title').textContent = texts.viral_title;
                    if (texts.viral_note) {
                        const noteEl = document.getElementById('viral-note');
                        noteEl.textContent = texts.viral_note;
                        noteEl.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Error loading texts:', error);
            }
        }

        // ===== تحميل الصفحة =====
        document.addEventListener('DOMContentLoaded', function() {
            updateHeader();
            loadServices();
            loadTexts();
        });
    </script>
</body>
</html>
