<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
    <title>Vision+</title>
    <style>
        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            position: relative;
        }
        .header-user img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #b0e0e6;
        }
        .header-user .username {
            color: #d4e9ed;
            font-weight: 600;
            font-size: 0.9em;
            display: none;
        }
        @media (min-width: 768px) {
            .header-user .username { display: inline; }
        }
        .user-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            min-width: 160px;
            display: none;
            overflow: hidden;
            z-index: 1000;
        }
        .user-dropdown.show { display: block; }
        .user-dropdown a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            color: #1e2b2f;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9em;
            transition: 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }
        .user-dropdown a:hover {
            background: #f4f9fa;
        }
        .user-dropdown a:last-child {
            border-bottom: none;
            color: #ff6b6b;
        }
        .user-dropdown a i {
            width: 20px;
            text-align: center;
        }
        /* تنسيقات الموهوبين الأكثر شهرة */
        .top-freelancers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .top-freelancer-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        .top-freelancer-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .top-freelancer-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #b0e0e6;
            margin-bottom: 10px;
        }
        .top-freelancer-card .name {
            font-weight: 700;
            color: #1e2b2f;
        }
        .top-freelancer-card .category {
            font-weight: 400;
            color: #5a6f73;
            font-size: 0.85em;
        }
        .top-freelancer-card .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.8em;
            color: #5a6f73;
        }
        .top-freelancer-card .stats span i {
            margin-right: 4px;
        }
        .top-freelancer-card .rank {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #b0e0e6;
            color: #1e2b2f;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8em;
        }
        .top-freelancer-card .card-inner {
            position: relative;
        }
        .viral .subtitle {
            text-align: center;
            color: var(--color-primary);
            font-weight: 400;
            margin-top: -15px;
            margin-bottom: 25px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">VISION+</a>
        <nav class="nav">
            <a href="index.html">الرئيسية</a>
            <a href="yourpage.html">حسابي</a>
            <a href="admin.html" style="color:#ff6b6b;">الإدارة</a>
            <div class="header-user" id="header-user" style="display:none;" onclick="toggleDropdown(event)">
                <img id="header-avatar" src="img/default-avatar.jpg" alt="avatar" />
                <span class="username" id="header-username">مستخدم</span>
                <div class="user-dropdown" id="user-dropdown">
                    <a href="yourpage.html"><i class="fas fa-user-edit"></i> حسابي</a>
                    <a href="#" onclick="event.stopPropagation(); logoutUser();"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
                </div>
            </div>
        </nav>
    </header>

    <section class="main" id="home">
        <div class="main-content">
            <h1 id="hero-title">مرحباً بك في VISION+</h1>
            <h2 id="hero-subtitle">منصة تجمع بين الموهوبين والعملاء</h2>
            <a href="yourpage.html" class="main-btn">انضم الآن</a>
        </div>
        <div class="floating-icons">
            <i class="fa-sharp fa-solid fa-pen-to-square fly-icon" style="--delay:0s; top:8%; left:3%; font-size: 3.5rem;"></i>
            <i class="fa-solid fa-code fly-icon" style="--delay:0.8s; top:15%; right:5%; font-size: 4rem;"></i>
            <i class="fa-solid fa-language fly-icon" style="--delay:1.6s; bottom:20%; left:5%; font-size: 3.8rem;"></i>
            <i class="fa-solid fa-paintbrush fly-icon" style="--delay:2.4s; top:40%; right:3%; font-size: 4.2rem;"></i>
            <i class="fa-solid fa-camera fly-icon" style="--delay:3.2s; bottom:12%; right:8%; font-size: 3.6rem;"></i>
        </div>
    </section>

    <section class="cards" id="services">
        <h2 class="title">الخدمات</h2>
        <div class="content" id="services-content"></div>
    </section>

    <section class="viral" id="viral">
        <h2 class="title" id="viral-title">🏆 الأكثر شهرة</h2>
        <p class="subtitle" id="viral-note">أفضل المواهب المختارة من فريقنا</p>
        <div class="content" id="viral-content">
            <div id="top-freelancers-container">
                <p style="color:#5a6f73; text-align:center; width:100%;">جاري تحميل الموهوبين...</p>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col">
                <h3>عن المنصة</h3>
                <p id="footer-text">جميع الحقوق محفوظة © 2026 Vision+</p>
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="auth.js"></script>
    <script>
        // ===== إظهار/إخفاء القائمة =====
        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('user-dropdown');
            dropdown.classList.toggle('show');
        }
        document.addEventListener('click', function() {
            document.getElementById('user-dropdown').classList.remove('show');
        });

        // ===== تحديث رأس الصفحة =====
        function updateHeaderUI() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('header-user').style.display = 'flex';
                document.getElementById('header-avatar').src = user.photoURL || 'img/default-avatar.jpg';
                document.getElementById('header-username').textContent = user.displayName || 'مستخدم';
                document.getElementById('header-username').style.display = 'inline';
            } else {
                document.getElementById('header-user').style.display = 'none';
            }
        }

        // ===== تحميل التخصصات =====
        async function loadServices() {
            const container = document.getElementById('services-content');
            try {
                const categories = await loadFromFirebase('categories');
                if (!categories) {
                    container.innerHTML = '<p style="color:#5a6f73; text-align:center; width:100%;">لا توجد خدمات حالياً</p>';
                    return;
                }
                
                let html = '';
                Object.values(categories).forEach(cat => {
                    html += `
                        <div class="card" onclick="showCategory('${cat.id}')" style="cursor:pointer;">
                            <div class="icon" style="color:${cat.color || '#b0e0e6'};">
                                <i class="fas ${cat.icon}"></i>
                            </div>
                            <div class="info">
                                <h2>${cat.name}</h2>
                                <p>عرض الموهوبين</p>
                                <a href="#" onclick="event.stopPropagation(); showCategory('${cat.id}')">عرض</a>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading services:', error);
            }
        }

        // ===== عرض الموهوبين حسب التخصص (مرتبين حسب المشاهدات) =====
        async function showCategory(categoryId) {
            console.log('🔍 عرض التخصص:', categoryId);
            
            try {
                const users = await loadFromFirebase('users');
                const container = document.getElementById('viral-content');
                const title = document.getElementById('viral-title');
                const note = document.getElementById('viral-note');
                
                // الحصول على اسم التخصص
                const categories = await loadFromFirebase('categories');
                const category = categories ? Object.values(categories).find(c => c.id === categoryId) : null;
                const catName = category ? category.name : categoryId;
                
                // تحديث العنوان
                title.textContent = `📂 ${catName}`;
                note.textContent = `الموهوبون في مجال ${catName}`;
                note.style.display = 'block';
                
                if (!users) {
                    container.innerHTML = '<p style="color:#5a6f73; text-align:center; width:100%;">لا يوجد موهوبين بعد</p>';
                    return;
                }
                
                // فلترة حسب التخصص والحالة
                let freelancers = Object.values(users).filter(u => 
                    u.status === 'approved' && u.categoryId === categoryId
                );
                
                console.log('👤 عدد الموهوبين:', freelancers.length);
                
                // ترتيب تنازلي حسب المشاهدات
                freelancers.sort((a, b) => (b.views || 0) - (a.views || 0));
                
                if (freelancers.length === 0) {
                    container.innerHTML = `
                        <div style="width:100%; text-align:center; padding:40px; color:#5a6f73;">
                            <p>لا يوجد موهوبين في هذا المجال</p>
                            <p style="font-weight:400;">كن الأول! <a href="yourpage.html" style="color:#b0e0e6;">سجل الآن</a></p>
                        </div>
                    `;
                    return;
                }
                
                let html = `<div class="top-freelancers">`;
                freelancers.forEach((f, index) => {
                    html += `
                        <div class="top-freelancer-card" onclick="viewProfile('${f.uid}')">
                            <div class="card-inner">
                                <div class="rank">#${index + 1}</div>
                                <img src="${f.profilePic || 'img/default-avatar.jpg'}" alt="${f.username}" />
                                <div class="name">${f.username || 'غير معروف'}</div>
                                <div class="category">${f.categoryId || 'لا يوجد تخصص'}</div>
                                <div class="stats">
                                    <span><i class="fas fa-eye"></i> ${f.views || 0}</span>
                                    <span><i class="fas fa-heart" style="color:#ff6b6b;"></i> ${f.likes || 0}</span>
                                    <span><i class="fas fa-calendar-alt"></i> ${f.joinedDate || 'غير معروف'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
                
                // تمرير إلى قسم الموهوبين
                document.getElementById('viral').scrollIntoView({ behavior: 'smooth' });
                
            } catch (error) {
                console.error('Error showing category:', error);
                document.getElementById('viral-content').innerHTML = `
                    <p style="color:#ff6b6b; text-align:center; width:100%;">❌ حدث خطأ في تحميل الموهوبين</p>
                `;
            }
        }

        // ===== تحميل الموهوبين الأكثر شهرة =====
        async function loadTopFreelancers() {
            const container = document.getElementById('top-freelancers-container');
            try {
                const users = await loadFromFirebase('users');
                if (!users) {
                    container.innerHTML = '<p style="color:#5a6f73; text-align:center; width:100%;">لا يوجد موهوبين بعد</p>';
                    return;
                }
                
                // فلترة المستخدمين المفعلين
                let freelancers = Object.values(users).filter(u => u.status === 'approved');
                
                if (freelancers.length === 0) {
                    container.innerHTML = `
                        <p style="color:#5a6f73; text-align:center; width:100%;">لا يوجد موهوبين مفعلين بعد</p>
                    `;
                    return;
                }
                
                // حساب النقاط: (المشاهدات * 1) + (الإعجابات * 3)
                freelancers.forEach(f => {
                    f.score = (f.views || 0) * 1 + (f.likes || 0) * 3;
                });
                
                // ترتيب حسب النقاط ثم المشاهدات
                freelancers.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return (b.views || 0) - (a.views || 0);
                });
                
                // أخذ أفضل 6 من كل تخصص (مجموعة واحدة)
                const categories = {};
                const topByCategory = {};
                
                freelancers.forEach(f => {
                    const cat = f.categoryId || 'other';
                    if (!categories[cat]) categories[cat] = [];
                    categories[cat].push(f);
                });
                
                // أخذ أفضل 6 من كل تخصص
                let topList = [];
                Object.keys(categories).forEach(cat => {
                    const sorted = categories[cat].slice(0, 6);
                    topList = topList.concat(sorted);
                });
                
                // ترتيب القائمة النهائية حسب النقاط
                topList.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return (b.views || 0) - (a.views || 0);
                });
                
                // أخذ أفضل 12 فقط
                topList = topList.slice(0, 12);
                
                let html = `<div class="top-freelancers">`;
                topList.forEach((f, index) => {
                    html += `
                        <div class="top-freelancer-card" onclick="viewProfile('${f.uid}')">
                            <div class="card-inner">
                                <div class="rank">🏆 #${index + 1}</div>
                                <img src="${f.profilePic || 'img/default-avatar.jpg'}" alt="${f.username}" />
                                <div class="name">${f.username || 'غير معروف'}</div>
                                <div class="category">${f.categoryId || 'لا يوجد تخصص'}</div>
                                <div class="stats">
                                    <span><i class="fas fa-eye"></i> ${f.views || 0}</span>
                                    <span><i class="fas fa-heart" style="color:#ff6b6b;"></i> ${f.likes || 0}</span>
                                    <span><i class="fas fa-calendar-alt"></i> ${f.joinedDate || 'غير معروف'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading top freelancers:', error);
                container.innerHTML = `
                    <p style="color:#ff6b6b; text-align:center; width:100%;">❌ حدث خطأ في تحميل الموهوبين</p>
                `;
            }
        }

        // ===== عرض الملف الشخصي =====
        function viewProfile(uid) {
            window.location.href = `profile.html?uid=${uid}`;
        }

        // ===== تحميل النصوص =====
        async function loadTexts() {
            try {
                const texts = await loadFromFirebase('site_texts');
                if (texts) {
                    if (texts.hero_title) document.getElementById('hero-title').textContent = texts.hero_title;
                    if (texts.hero_subtitle) document.getElementById('hero-subtitle').textContent = texts.hero_subtitle;
                    if (texts.footer_text) document.getElementById('footer-text').textContent = texts.footer_text;
                    if (texts.viral_title) document.getElementById('viral-title').textContent = texts.viral_title;
                    if (texts.viral_note) {
                        const noteEl = document.getElementById('viral-note');
                        noteEl.textContent = texts.viral_note;
                        noteEl.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Error loading texts:', error);
            }
        }

        // ===== مراقبة المصادقة =====
        function setupAuthListener() {
            onAuthStateChange((user) => {
                updateHeaderUI();
            });
            
            // التحقق الفوري
            const user = getCurrentUser();
            if (user) {
                updateHeaderUI();
            }
        }

        // ===== تحميل الصفحة =====
        document.addEventListener('DOMContentLoaded', function() {
            setupAuthListener();
            loadServices();
            loadTexts();
            loadTopFreelancers();
            
            // تحديث كل 5 دقائق
            setInterval(loadTopFreelancers, 300000);
        });

        // تصدير الدوال
        window.showCategory = showCategory;
        window.viewProfile = viewProfile;
        window.toggleDropdown = toggleDropdown;
        window.updateHeaderUI = updateHeaderUI;
    </script>
</body>
</html>
